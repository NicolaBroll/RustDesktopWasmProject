name: audit

# Known vulnerabilities and yanked crates (`cargo deny check advisories`, `deny.toml`). Not in
# `cargo xtask ci`: the advisory database changes every day, so a new advisory would block a
# step at random. Weekly, on pull requests to master and by hand.
on:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories
