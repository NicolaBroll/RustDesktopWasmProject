name: ci

on:
  push:
    branches: [master]
  # Le pull request verso dev (una per step) per ora non passano dalla CI: la build si verifica
  # in locale con `cargo xtask ci`.
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Lo stesso comando che si usa in locale.
      - run: cargo xtask ci
