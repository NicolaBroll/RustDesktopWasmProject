name: ci

on:
  push:
    branches: [master]
  # Pull requests to dev (one per step) do not go through CI for now: the build is verified
  # locally with `cargo xtask ci`.
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # The same command used locally.
      - run: cargo xtask ci
