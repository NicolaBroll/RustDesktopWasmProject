name: package

# Builds the packages (`packaging/README.md`) and uploads them as artifacts of the run; on a
# `v*` tag it also creates a GitHub Release with them attached. Both jobs run on Ubuntu (the
# Windows build is cross-compiled with mingw-w64, like `make windows` locally).
on:
  push:
    branches: [master]
    tags: ["v*"]
  # Pull requests that touch the packaging check that it still builds.
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/package.yml"
      - "apps/project/build.rs"
  # "Run workflow" in the Actions tab, on any branch (e.g. dev); the button appears once this
  # file is on the default branch (master).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    # 22.04: the binary's glibc baseline (GLIBC_2.35), so the AppImage runs from Ubuntu 22.04 on.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make appimage
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: |
            target/appimage/*.AppImage
            target/appimage/*.AppImage.zsync
            target/appimage/SHA256SUMS.txt
          if-no-files-found: error

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip wixl
      - run: make windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            target/windows/*.zip
            target/windows/*.msi
            target/windows/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
      # One SHA256SUMS.txt for all the packages. Notes: the tag's section of CHANGELOG.md
      # (`## [0.1.0]` for `v0.1.0`), then the list of pull requests generated by GitHub.
      - run: |
          cat dist/appimage/SHA256SUMS.txt dist/windows/SHA256SUMS.txt > dist/SHA256SUMS.txt
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { on = index($0, "## [" v "]") == 1; next }
            on' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || { echo "no section for $version in CHANGELOG.md" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "BinariGit $version" --notes-file dist/notes.md --generate-notes \
            dist/appimage/*.AppImage dist/appimage/*.AppImage.zsync dist/windows/*.zip \
            dist/windows/*.msi \
            dist/SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
