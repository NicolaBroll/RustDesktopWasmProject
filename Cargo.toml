[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["apps/project"]

[workspace.package]
version = "0.7.0"
edition = "2024"
# Minimum Rust: the highest `rust-version` of the dependencies (egui 0.37: 1.95). Raise it
# with egui; clippy `incompatible_msrv` checks the std APIs we use.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# From the nursery/pedantic groups, the ones without false positives here.
redundant_clone = "warn"

[workspace.dependencies]
# Internal layers
project-core   = { path = "crates/core" }
project-i18n   = { path = "crates/i18n" }
project-domain = { path = "crates/domain" }
project-engine = { path = "crates/engine" }
project-ui     = { path = "crates/ui" }
project-mcp    = { path = "crates/mcp" }
project-git    = { path = "crates/git" }

# Common
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JSON Schema of the command parameters (catalog of CLI and MCP).
schemars = "1"
thiserror = "2"
log = "0.4"
libc = "0.2"
# Random token of the askpass bridge (S52); already in the lock through ahash (egui).
getrandom = "0.3"
anyhow = "1"

# Languages
fluent-bundle = "0.16"
fluent-syntax = "0.12"

# UI
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }

# Desktop
env_logger = "0.11"
rfd = "0.17"
pollster = "0.4"
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }

# CLI and tools
clap = { version = "4", features = ["derive"] }
cargo_metadata = "0.23"
proptest = "1"
tempfile = "3"
insta = "1.49"

[profile.release]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
