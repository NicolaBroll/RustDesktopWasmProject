[package]
name = "project"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
log = "0.4"
serde = { version = "1", features = ["derive"] }

# Desktop
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

# Web
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }

[profile.release]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
