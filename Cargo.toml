[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["apps/project"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# Livelli interni
project-core   = { path = "crates/core" }
project-domain = { path = "crates/domain" }
project-engine = { path = "crates/engine" }
project-ui     = { path = "crates/ui" }
project-mcp    = { path = "crates/mcp" }
project-git    = { path = "crates/git" }

# Comuni
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
anyhow = "1"

# UI
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }

# Desktop
env_logger = "0.11"
rfd = "0.17"

# Web
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

# CLI e strumenti
clap = { version = "4", features = ["derive"] }
cargo_metadata = "0.23"
proptest = "1"
tempfile = "3"

[profile.release]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
