[package]
name = "project-engine"
description = "L5: session, command catalog, undo, I/O via traits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
project-core.workspace = true
project-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
project-i18n.workspace = true

[features]
# `MemoryBackend`/`MemoryOpener` (in-memory repo with a sample): only for the tests of the
# crates that use it (`[dev-dependencies]`), never in the app binaries.
test-support = []

[dev-dependencies]
fluent-syntax.workspace = true
proptest.workspace = true
insta = { workspace = true, features = ["json"] }

[lints]
workspace = true
